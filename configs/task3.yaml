# Task 3 – test-time compute
seed: 6304
data_root: data/ATML-PA3-Data          # download the course Google-Drive folder here (git-ignored)
models:
  math:      {folder: Qwen2.5-3B-Instruct,    dataset: MATH,      type: llm}
  mathvista: {folder: Qwen2.5-VL-3B-Instruct, dataset: MathVista, type: vlm}
mathvista_metadata: data/mathvista_testmini.json   # https://github.com/lupantech/MathVista/blob/main/data/testmini.json

# Column names in the supplied parquet files. Run `python -m task3_ttc.data inspect` once and fix these
# to match README.MD of ATML-PA3-Data. Each entry lists accepted aliases (first match wins).
columns:
  dataset: [dataset]
  question_id: [sample_id, question_id]
  rollout_id: [rollout_id]
  text: [response, generation, text, output]
  token_ids: [token_ids, output_token_ids, generated_token_ids]
  n_tokens: [num_tokens, n_tokens, output_len, length, num_output_tokens]
  extracted: [extracted_answer, pred_answer, answer_extracted, extracted]
  gold: [gold_answer, answer, gold]
  problem: [problem, question, prompt_text, query]
  logp: [logp, token_logp, logprobs]
  kl: [kl_u_p, kl]
  attn_image: [attn_image, image_attention, attention_image]
  attn_prompt: [attn_prompt, prompt_attention, attention_prompt, attn_prompt_text]
  attn_generated: [attn_generated, generated_attention, attention_generated, attn_generated_text]

splits:
  n_dev: 200
  n_live: 50
budgets: [1, 2, 4, 8, 16, 32]
n_orders: 10
n_bootstrap: 1000

adaptive:
  check_points: [4, 8, 16]
  max_n: 32
  tau: [0.5, 0.625, 0.75, 0.875, 1.0]
  gamma: [0.0, 0.1, 0.25, 0.5]
  tolerance_pp: 1.0

live:
  model: Qwen/Qwen2.5-3B-Instruct
  revision: null                       # set to the revision hash listed in README.MD
  dtype: float16
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  repetition_penalty: 1.0
  system: "You are a helpful assistant."
  instruction: "Think step by step inside <think> </think> tags, then give your final answer inside \\boxed{}."
  revise_instruction: "Review the solution above. Identify and correct any errors; if it is correct, retain its answer. Give your final answer inside \\boxed{}."
  single_cap: 3072
  parallel_cap: 1024
  n_parallel: 3
  revise_cap: 2048

paths:
  outputs: outputs/task3
  results: results/task3
