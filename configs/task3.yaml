# Task 3 – test-time compute
seed: 6304
data_root: data/ATML-PA3-Data          # download the course Google-Drive folder here (git-ignored)
models:
  math:      {folder: qwen25-math,        dataset: MATH,      type: llm}
  mathvista: {folder: qwen25vl-mathvista, dataset: MathVista, type: vlm}
mathvista_metadata: data/mathvista_testmini.json   # https://github.com/lupantech/MathVista/blob/main/data/testmini.json

# Column names in the supplied parquet files (from ATML-PA3-Data/README.MD).
columns:
  dataset: [dataset]
  question_id: [sample_id, question_id]
  rollout_id: [rollout_id]
  text: [generated_text]
  token_ids: [generated_token_ids]
  n_tokens: [n_generated_text_tokens]      # scalar in generations.parquet (the attention file's list is suffixed _att)
  extracted: [extracted_answer]
  gold: [gold_answer]
  problem: [question_text]
  logp: [logp]
  kl: [kl_u_p]
  attn_image: [img_attn_total]
  attn_prompt: [prompt_text_attn_total]
  attn_generated: [generated_text_attn_total]

splits:
  n_dev: 200
  n_live: 50
budgets: [1, 2, 4, 8, 16, 32]
n_orders: 10
n_bootstrap: 1000

adaptive:
  check_points: [4, 8, 16]
  max_n: 32
  tau: [0.5, 0.625, 0.75, 0.875, 1.0]
  gamma: [0.0, 0.1, 0.25, 0.5]
  tolerance_pp: 1.0

live:
  model: Qwen/Qwen2.5-3B-Instruct
  revision: aa8e72537993ba99e69dfaafa59ed015b17504d1   # pinned in ATML-PA3-Data/README.MD
  dtype: float16
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  repetition_penalty: 1.0
  system: "You are a helpful assistant."
  instruction: "Think step by step inside <think> </think> tags, then give your final answer inside \\boxed{}."
  revise_instruction: "Review the solution above. Identify and correct any errors; if it is correct, retain its answer. Give your final answer inside \\boxed{}."
  single_cap: 3072
  parallel_cap: 1024
  n_parallel: 3
  revise_cap: 2048

paths:
  outputs: outputs/task3
  results: results/task3
